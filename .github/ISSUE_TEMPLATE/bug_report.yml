name: Bug Report
description: Report something that isn't working as expected in dataforge-cli
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: prior-search
    attributes:
      label: Prior search
      description: Please confirm before filing to avoid duplicates.
      options:
        - label: I searched existing open and closed issues and didn't find this reported already.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, specific summary of the bug.
      placeholder: The preview table on the generated index.html overflows/wraps badly when the dataset has many columns.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact commands and actions, in order.
      placeholder: |
        1. Clone the repo and install per README
        2. Run: dataforge build examples\sample_repeaters.csv --out-dir output\repeaters
        3. Open output\repeaters\index.html in a browser
        4. Observe the Preview table
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify in Additional Context)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.4 (python --version)"
    validations:
      required: false

  - type: input
    id: dataforge-version
    attributes:
      label: dataforge-cli version or commit
      placeholder: "e.g. main branch, commit 124e1cd, or pip show dataforge-cli"
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - pip install -e ".[dev]" (source checkout)
        - PyPI package
        - PyInstaller build
        - Nuitka build
        - cx_Freeze build
        - Other (specify in Additional Context)
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, logs, sample dataset details, related issues, etc. You can drag and drop images directly into this box.
    validations:
      required: false
