name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dataforge-cli (dev)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

  dependency-floor:
    name: Dependency floor (typer==0.12.1, click==8.1.8, numpy 1.x, minimum pyproject.toml versions)
    runs-on: ubuntu-latest
    # This job exists specifically because of GitHub issue #3: the CLI
    # crashed on any Typer version below 0.19.0 despite pyproject.toml
    # declaring `typer>=0.12` as sufficient. Every other job in this
    # workflow installs whatever the *latest* compatible dependency
    # versions are, which would NOT have caught that bug -- only pinning
    # to the actual declared floor and running the suite against it does.
    #
    # Three follow-up incidents while building this job (see #4, #5, #6),
    # all the same root cause: pinning one package to an old version
    # without also pinning ITS transitive dependencies to versions that
    # were actually compatible with it at the time.
    #   - typer==0.12.0 has a known upstream packaging bug
    #     (fastapi/typer#790) that corrupts an in-place upgrade to that
    #     exact version; fixed in 0.12.1. Pins are installed into a clean
    #     environment BEFORE dataforge-cli itself (`--no-deps` on the
    #     editable install) to avoid in-place-upgrade bugs like this one
    #     entirely, not just this specific instance.
    #   - pandas==2.1.0 predates NumPy 2.0's C-ABI break; numpy is pinned
    #     to the last 1.x release even though dataforge-cli has no
    #     direct dependency on it.
    #   - typer==0.12.1 declares only a loose `click>=8.0.0`, and Click
    #     8.2.0 made a breaking API change (Parameter.make_metavar()
    #     gained a required `ctx` arg) that crashes older Typer's
    #     --help rendering. Typer only self-pins click<8.2.0 starting
    #     around 0.15.4; click is pinned explicitly here to the version
    #     the Typer maintainers themselves recommend for this exact
    #     incompatibility (fastapi/typer#1215).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10 (minimum supported)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned minimum dependency versions (before dataforge-cli itself)
        run: |
          pip install \
            "typer==0.12.1" \
            "click==8.1.8" \
            "numpy==1.26.4" \
            "pandas==2.1.0" \
            "PyYAML==6.0" \
            "Jinja2==3.1.0" \
            "rich==13.7.0" \
            "plotly==5.20.0" \
            "openpyxl==3.1.0" \
            "requests==2.31.0" \
            "python-dateutil==2.9.0" \
            "pytest>=8.0" "pytest-cov>=5.0"

      - name: Install dataforge-cli without re-resolving dependencies
        run: pip install -e . --no-deps

      - name: Verify the CLI actually starts (regression guard for #3)
        run: dataforge --help

      - name: Run test suite against the dependency floor
        run: pytest -v

  optional-extras:
    name: Optional extras (frictionless, profiling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with all optional extras
        run: pip install -e ".[dev,frictionless,profiling]"

      - name: Run full test suite (extras-dependent tests should now execute, not skip)
        run: pytest -v
