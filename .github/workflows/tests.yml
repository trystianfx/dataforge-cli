name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dataforge-cli (dev)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

  dependency-floor:
    name: Dependency floor (typer==0.12.0, minimum pyproject.toml versions)
    runs-on: ubuntu-latest
    # This job exists specifically because of GitHub issue #3: the CLI
    # crashed on any Typer version below 0.19.0 despite pyproject.toml
    # declaring `typer>=0.12` as sufficient. Every other job in this
    # workflow installs whatever the *latest* compatible dependency
    # versions are, which would NOT have caught that bug -- only pinning
    # to the actual declared floor and running the suite against it does.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10 (minimum supported)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dataforge-cli with pinned minimum dependency versions
        run: |
          pip install -e ".[dev]"
          pip install \
            "typer==0.12.0" \
            "pandas==2.1.0" \
            "PyYAML==6.0" \
            "Jinja2==3.1.0" \
            "rich==13.7.0" \
            "plotly==5.20.0" \
            "openpyxl==3.1.0" \
            "requests==2.31.0" \
            "python-dateutil==2.9.0"

      - name: Verify the CLI actually starts (regression guard for #3)
        run: dataforge --help

      - name: Run test suite against the dependency floor
        run: pytest -v

  optional-extras:
    name: Optional extras (frictionless, profiling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with all optional extras
        run: pip install -e ".[dev,frictionless,profiling]"

      - name: Run full test suite (extras-dependent tests should now execute, not skip)
        run: pytest -v
