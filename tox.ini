[tox]
envlist = py{310,311,312}, dependency-floor, extras
skip_missing_interpreters = true

[testenv]
description = Run the test suite against whatever dependency versions pip resolves normally.
extras = dev
commands = pytest -v {posargs}

[testenv:dependency-floor]
description =
    Reproduce GitHub issue #3 locally: install the exact minimum versions
    pyproject.toml declares (typer>=0.12.1, etc.) instead of latest, and
    verify the CLI actually starts. Run this before bumping any
    dependency floor down, and after any change to cli.py's parameter
    types.

    Three follow-up fixes baked into these pins (see #4, #5, #6), all
    the same root cause: pinning a package to an old version without
    also pinning ITS transitive dependencies to versions compatible
    with it at the time.
      - typer==0.12.1, not 0.12.0 -- 0.12.0 has a known upstream
        packaging bug (fastapi/typer#790) that corrupts an in-place
        upgrade to that exact version.
      - numpy==1.26.4 pinned alongside pandas==2.1.0 -- pandas 2.1.0
        predates NumPy 2.0's C-ABI break.
      - click==8.1.8 pinned alongside typer==0.12.1 -- Click 8.2.0 made
        a breaking API change (Parameter.make_metavar() gained a
        required ctx arg) that crashes this Typer version's --help
        rendering; 8.1.8 is the version Typer's own maintainers
        recommend for this exact incompatibility (fastapi/typer#1215).
    Neither numpy nor click are direct dependencies of dataforge-cli;
    both pins exist purely to make this reproduction internally
    consistent.
basepython = python3.10
extras = dev
deps =
    typer==0.12.1
    click==8.1.8
    numpy==1.26.4
    pandas==2.1.0
    PyYAML==6.0
    Jinja2==3.1.0
    rich==13.7.0
    plotly==5.20.0
    openpyxl==3.1.0
    requests==2.31.0
    python-dateutil==2.9.0
commands =
    dataforge --help
    pytest -v {posargs}

[testenv:extras]
description = Run the suite with all optional extras installed, so extras-dependent tests execute instead of skipping.
extras = dev,frictionless,profiling
commands = pytest -v {posargs}
