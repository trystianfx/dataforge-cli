[tox]
envlist = py{310,311,312}, dependency-floor, extras
skip_missing_interpreters = true

[testenv]
description = Run the test suite against whatever dependency versions pip resolves normally.
extras = dev
commands = pytest -v {posargs}

[testenv:dependency-floor]
description =
    Reproduce GitHub issue #3 locally: install the exact minimum versions
    pyproject.toml declares (typer>=0.12.1, etc.) instead of latest, and
    verify the CLI actually starts. Run this before bumping any
    dependency floor down, and after any change to cli.py's parameter
    types.

    Note: pinned to typer==0.12.1, not 0.12.0 -- 0.12.0 has a known
    upstream packaging bug (fastapi/typer#790) that corrupts the install
    when upgraded/downgraded to in-place within an existing environment.
    tox's `deps` are installed into a fresh venv before the package
    itself, which avoids that in-place-upgrade failure mode; the
    equivalent GitHub Actions job installs pinned deps in a dedicated
    step before `dataforge-cli` for the same reason. See issue #4.
basepython = python3.10
extras = dev
deps =
    typer==0.12.1
    pandas==2.1.0
    PyYAML==6.0
    Jinja2==3.1.0
    rich==13.7.0
    plotly==5.20.0
    openpyxl==3.1.0
    requests==2.31.0
    python-dateutil==2.9.0
commands =
    dataforge --help
    pytest -v {posargs}

[testenv:extras]
description = Run the suite with all optional extras installed, so extras-dependent tests execute instead of skipping.
extras = dev,frictionless,profiling
commands = pytest -v {posargs}
